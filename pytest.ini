[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Isolated fast correctness tests for business logic and math
    integration: Database, API and cross-module interaction tests
    regression: Mathematical and contract baseline regression tests
    performance: Throughput, latency, and resource benchmarks
    smoke: Rapid application health and critical functionality checks
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
